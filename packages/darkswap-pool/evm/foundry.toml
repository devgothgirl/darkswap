[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "../fixtures" }]
allow_paths = [".."]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
]
