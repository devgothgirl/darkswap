openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Solana discovery, Houdini and NEAR Intents private routes, and separate OKX public swaps
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: swap
  - name: discovery
  - name: marketing
  - name: near-market
  - name: support
  - name: rewards
  - name: launch-discovery
  - name: launch
  - name: launch-auth
  - name: launch-admin
paths:
  /dark-rewards/estimate:
    get:
      operationId: getDarkRewardsEstimate
      tags: [rewards]
      summary: Daily USD estimate of owner-confirmed $DARK holder distributions
      description: Confirmed distribution amounts valued at the day's public token prices. An estimate, not a payout record or guarantee.
      responses:
        "200":
          description: USD estimate priced at most once per day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DarkRewardsEstimate" }
        "503":
          description: Prices are unavailable; no placeholder values are returned
  /stonkfun/tokens:
    get:
      operationId: getStonkfunTokens
      tags: [launch-discovery]
      summary: A bounded page of normalized StonkFun discovery tokens
      description: |
        Uses documented provider-wide q (name/symbol/mint), quoteMint and status
        filters, with bounded page/pageSize. Matching case/prefix/fuzzy semantics
        are provider-defined and not independently established. No creator or
        quote-symbol search. When sort is omitted, trending uses upstream volume;
        other views use newest. Graduating maps to status=aboutToGraduate and
        graduated maps to status=graduated, trusting provider classification rather
        than recalculating progress from market cap. Explicit conflicting status
        or DARK quoteMint filters return 400. DARK requires the configured verified
        mint and uses provider quoteMint filtering; unavailable DARK returns an
        honest empty activation state. NEAR grouping may filter the current page
        locally when multiple evidence-backed mints exist and must disclose this.
        Provider q is catalog-wide, but local view filtering may still be page-only.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: sort
          description: Forwarded upstream; omitted defaults to volume for trending, newest otherwise.
          schema: { type: string, enum: [newest, volume] }
        - in: query
          name: view
          schema: { type: string, enum: [trending, new, dark, near, graduating, graduated], default: trending }
        - in: query
          name: q
          description: Documented provider-wide token name/symbol/mint search. No verified creator lookup or pair-symbol search; use quoteMint for pair identity.
          schema: { type: string, maxLength: 120, default: "" }
        - in: query
          name: quoteMint
          description: Documented provider-wide exact quote mint filter; must not conflict with a verified ecosystem view.
          schema: { $ref: "#/components/schemas/LaunchSolanaAddress" }
        - in: query
          name: status
          description: Documented upstream status filter; view graduating/graduated binds the corresponding status.
          schema: { type: string, enum: [new, aboutToGraduate, graduated] }
      responses:
        "200":
          description: Normalized page including explicit freshness and coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StonkfunTokensResponse" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "502": { $ref: "#/components/responses/LaunchProviderFailure" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /stonkfun/pairs:
    get:
      operationId: getStonkfunPairs
      tags: [launch-discovery]
      summary: Normalized upstream launchable pairs with local readiness
      description: |
        Always requests upstream launchable=true. Identity is network+mint and
        selectBy=mint. Upstream launchable and launchLabReady are discovery facts,
        not proof that this application's execution adapter is available. All
        executionAvailable values are false. Returns upstream pairs only; the
        locked DARK promotion card comes from /launch/config, not a fabricated pair.
        Preparation choices require launchable=true AND launchLabReady=true.
        False or absent launchLabReady is not readiness. Local order is verified
        DARK, verified NEAR, stablecoin, other, then priority.
        No native NEAR-chain compatibility is implied by a NEAR-symbol Solana mint.
      responses:
        "200":
          description: Current pairs, ambiguity and freshness metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StonkfunPairsResponse" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "502": { $ref: "#/components/responses/LaunchProviderFailure" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /stonkfun/tokens/{mint}:
    get:
      operationId: getStonkfunToken
      tags: [launch-discovery]
      summary: Resolve a verified mint from the bounded persistent discovery catalog
      description: |
        Does not invent an upstream token-detail endpoint. An unindexed mint is
        NOT_INDEXED (404), not proof it does not exist. NOT_FOUND may be used only
        when a verified source establishes absence. Provider failure is distinct.
      parameters:
        - $ref: "#/components/parameters/LaunchMint"
      responses:
        "200":
          description: Verified normalized token and source age
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StonkfunTokenResponse" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "404": { $ref: "#/components/responses/LaunchNotFound" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "502": { $ref: "#/components/responses/LaunchProviderFailure" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/config:
    get:
      operationId: getLaunchConfig
      tags: [launch]
      summary: Public preparation-only launch configuration and capability gates
      responses:
        "200":
          description: Public settings; execution can never be enabled by configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchConfig" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/auth/challenge:
    post:
      operationId: createLaunchAuthChallenge
      tags: [launch-auth]
      summary: Create an expiring single-use wallet ownership challenge
      description: |
        Requires an allowed same-origin request and rate protection. The exact
        UTF-8 message binds the Solana wallet, mainnet-beta network, configured
        application domain, nonce and expiry. Signing is authentication only:
        no transaction, fee, spending approval or private key is requested.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchAuthChallengeInput" }
      responses:
        "200":
          description: Sign exactly message as UTF-8 using wallet.signMessage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchAuthChallenge" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/auth/verify:
    post:
      operationId: verifyLaunchAuth
      tags: [launch-auth]
      summary: Verify the wallet proof and establish an isolated secure session
      description: |
        Accepts a base64-encoded 64-byte Ed25519 signature of the challenge
        message. Expired, consumed, wrong-wallet/domain/network proofs fail.
        Sets an HttpOnly, SameSite cookie (Secure in HTTPS). Returns a CSRF token
        for subsequent private mutations. Rotate session on authentication.
        isAdmin is independently server-authorized and defaults false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchAuthProofInput" }
      responses:
        "200":
          description: Authenticated wallet session; cookie is never exposed in JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchAuthenticatedSession" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/auth/session:
    get:
      operationId: getLaunchAuthSession
      tags: [launch-auth]
      summary: Read the current session without requiring a wallet connection
      description: Unauthenticated sessions return wallet, csrfToken and expiresAt null and isAdmin false. Private responses use Cache-Control no-store.
      responses:
        "200":
          description: Current session or explicit anonymous state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchAuthSession" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/auth/logout:
    post:
      operationId: logoutLaunchAuth
      tags: [launch-auth]
      summary: Revoke the session and clear its cookie
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      responses:
        "204": { description: Session revoked; client must clear all previous wallet private query state }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
  /launch/drafts:
    get:
      operationId: getLaunchDrafts
      tags: [launch]
      summary: List only the authenticated wallet's private saved drafts
      security: [{ launchSession: [] }]
      responses:
        "200":
          description: Private drafts, newest update first; never launched tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchDraftList" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
    post:
      operationId: createLaunchDraft
      tags: [launch]
      summary: Persist a private preparation draft, not an upstream launch
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchDraftInput" }
      responses:
        "201":
          description: Saved preparation draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchDraft" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/drafts/{id}:
    parameters:
      - $ref: "#/components/parameters/LaunchId"
    get:
      operationId: getLaunchDraft
      tags: [launch]
      summary: Read an owned private draft
      security: [{ launchSession: [] }]
      responses:
        "200":
          description: Owned draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchDraft" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "404": { $ref: "#/components/responses/LaunchNotFound" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
    put:
      operationId: updateLaunchDraft
      tags: [launch]
      summary: Replace an owned draft's editable configuration
      description: Any edit invalidates prior configuration review. Logo references must be validated assets owned by this wallet. A saved pair is not a readiness guarantee.
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchDraftInput" }
      responses:
        "200":
          description: Updated preparation draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchDraft" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "404": { $ref: "#/components/responses/LaunchNotFound" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
    delete:
      operationId: deleteLaunchDraft
      tags: [launch]
      summary: Delete an owned private draft
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      responses:
        "204": { description: Draft deleted }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "404": { $ref: "#/components/responses/LaunchNotFound" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/logos/request-url:
    post:
      operationId: requestLaunchLogoUpload
      tags: [launch]
      summary: Reserve a private logo and obtain a short-lived presigned direct upload URL
      description: |
        No raw upload API. Request PNG/JPEG only, at most 1 MiB. Client PUTs the
        file bytes directly to uploadURL with the declared Content-Type, then
        calls complete. A reserved ID is not usable in a draft until byte
        validation and safe re-encoding succeed. Original objects remain private.
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchLogoUploadInput" }
      responses:
        "201":
          description: Reserved private asset and direct upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchLogoUpload" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "413": { $ref: "#/components/responses/LaunchBadRequest" }
        "429": { $ref: "#/components/responses/LaunchRateLimited" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/logos/{id}/complete:
    post:
      operationId: completeLaunchLogoUpload
      tags: [launch]
      summary: Validate uploaded private bytes and record a safe re-encoded logo
      description: |
        Owner-only. Validate actual length <=1048576, magic bytes and successful
        decoding, not filename or declared MIME alone. Reject SVG, invalid
        images and oversized dimensions/decompression bombs. Strip metadata,
        re-encode to a separate private object, and never serve raw uploaded bytes.
        Idempotent for an already validated owned ID.
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchId"
        - $ref: "#/components/parameters/LaunchCsrf"
      responses:
        "200":
          description: Validated asset ID is now available for owned drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchLogo" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "404": { $ref: "#/components/responses/LaunchNotFound" }
        "413": { $ref: "#/components/responses/LaunchBadRequest" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/logos/{id}:
    get:
      operationId: getLaunchLogo
      tags: [launch]
      summary: Read only the authenticated owner's validated re-encoded logo
      description: Sends private no-store cache policy and nosniff. Cross-wallet IDs return 404; unfinished uploads are never served.
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchId"
      responses:
        "200":
          description: Validated private image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "404": { $ref: "#/components/responses/LaunchNotFound" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/creator:
    get:
      operationId: getLaunchCreator
      tags: [launch]
      summary: Private creator dashboard with verified attribution and nullable metrics
      description: No inferred ownership, summed/double-counted holder totals, reward issuance or linkage to swap reward ledgers. Missing evidence is null, never zero.
      security: [{ launchSession: [] }]
      responses:
        "200":
          description: Owned drafts, evidence-backed launches and planned incentive state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchCreatorResponse" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/admin/config:
    get:
      operationId: getLaunchAdminConfig
      tags: [launch-admin]
      summary: Read launch configuration as an independently authorized admin
      security: [{ launchSession: [] }]
      responses:
        "200":
          description: Auditable configuration; unconfigured admin authorization denies access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchConfig" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
    put:
      operationId: updateLaunchAdminConfig
      tags: [launch-admin]
      summary: Replace proposed local configuration and append an audit record
      description: |
        Pair overrides require mint/network evidence and cannot create upstream
        availability, change network support or bypass the unavailable adapter.
        Fee/campaign/points proposals do not charge fees, execute campaigns,
        issue claimable value or promise rewards. executionAvailable is immutable
        false and is forbidden in this request body.
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchConfigInput" }
      responses:
        "200":
          description: Updated auditable configuration, execution still unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchConfig" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/admin/reviews:
    get:
      operationId: getLaunchAdminReviews
      tags: [launch-admin]
      summary: Read evidence-backed metadata and wallet review flags
      security: [{ launchSession: [] }]
      responses:
        "200":
          description: Reviews, newest first; no claim of comprehensive fraud detection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchReviewList" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
    post:
      operationId: createLaunchAdminReview
      tags: [launch-admin]
      summary: Record an evidence-backed under_review flag and audit it
      description: A review blocks automatic featured promotion and eligibility. Heuristics are not proof of identity. Metadata suppression is local, never an upstream edit.
      security: [{ launchSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LaunchCsrf"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchReviewInput" }
      responses:
        "201":
          description: Evidence-backed review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchReview" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/admin/audit:
    get:
      operationId: getLaunchAdminAudit
      tags: [launch-admin]
      summary: Read bounded launch-only admin audit records
      security: [{ launchSession: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Newest audit records first; no session secrets or swap histories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaunchAuditList" }
        "400": { $ref: "#/components/responses/LaunchBadRequest" }
        "401": { $ref: "#/components/responses/LaunchUnauthenticated" }
        "403": { $ref: "#/components/responses/LaunchForbidden" }
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /launch/submit:
    post:
      operationId: submitLaunch
      tags: [launch]
      summary: Fail closed; launch execution is unavailable in this release
      description: |
        Every direct request returns 503 and executionAvailable=false, including
        alternative pairs, changed admin settings and paused/unpaused states.
        Never contacts a fabricated provider execution endpoint, charges fees,
        prompts a wallet transaction, returns a signature or creates a launch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchSubmitInput" }
      responses:
        "503": { $ref: "#/components/responses/LaunchUnavailable" }
  /support/requests:
    post:
      operationId: createSupportRequest
      tags: [support]
      summary: Email a swap support report to the DarkSwap support inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportRequestInput"
      responses:
        "200":
          description: Case saved; delivery is not yet guaranteed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestResponse"
        "400":
          description: Invalid report
        "429":
          description: Too many requests
        "503":
          description: Case could not be saved
  /support/requests/status:
    get:
      operationId: getSupportRequestStatus
      tags: [support]
      summary: Check delivery state of a support case using its private token
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Case delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequestStatus"
        "404":
          description: Unknown case
        "503":
          description: Status unavailable
  /near/trends:
    get:
      operationId: getNearTrends
      tags: [near-market]
      summary: Read-only NEAR liquidity pool trends from GeckoTerminal
      parameters:
        - in: query
          name: view
          schema:
            type: string
            enum: [trending, new]
      responses:
        "200":
          description: Live NEAR pool activity, cached briefly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearTrendsResponse"
        "400":
          description: Invalid view
        "503":
          description: Market data temporarily unavailable
  /near/pools/search:
    get:
      operationId: searchNearPools
      tags: [near-market]
      summary: Search NEAR liquidity pools via GeckoTerminal (read-only)
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - in: query
          name: page
          description: Provider page number. Page 1 is the default; requests are limited to pages 1 through 10.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
      responses:
        "200":
          description: Provider search matches for the requested NEAR page, cached briefly; not an exhaustive token directory. hasNextPage is true when the raw provider page is nonempty and page is below 10, meaning another page may be requested, not that it is guaranteed to contain matches. Stop only when a raw provider page is empty or page 10 is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearPoolSearchResponse"
        "400":
          description: Invalid search query
        "503":
          description: Market data temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /marketing/health:
    get:
      operationId: checkMarketingWebhookHealth
      tags: [marketing]
      summary: Check signed marketing webhook delivery before campaigns
      description: Separate from swap health; returns no contact or provider identifiers.
      responses:
        "200":
          description: Recent correlated webhook activity and no backlog or processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingWebhookHealth"
        "503":
          description: Marketing campaigns paused or health check unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingWebhookHealth"
  /marketing/subscriptions:
    post:
      operationId: subscribeUpdates
      tags: [marketing]
      summary: Opt in to optional product updates and potential discounts
      description: Requests an email confirmation after explicit consent. Only confirmed, non-suppressed contacts can receive marketing. Never links to swap orders or wallets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingSubscriptionInput"
      responses:
        "200":
          description: Generic acknowledgement, including for an existing subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingSubscriptionResponse"
        "400":
          description: Invalid email or consent
        "429":
          description: Too many requests
        "503":
          description: Subscription intake unavailable
  /marketing/confirm:
    get:
      operationId: showMarketingConfirmation
      tags: [marketing]
      summary: Show an explicit confirmation form without changing consent
      parameters:
        - in: query
          name: token
          schema:
            type: string
      responses:
        "200":
          description: Confirmation form
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: confirmMarketingSubscription
      tags: [marketing]
      summary: Verify opt-in with a single-use token expiring after 24 hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingTokenInput"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/MarketingTokenInput"
      responses:
        "200":
          description: Subscription confirmed
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid token
        "410":
          description: Expired, previously used, or inactive confirmation
        "503":
          description: Confirmation unavailable
  /marketing/unsubscribe:
    get:
      operationId: showMarketingUnsubscribe
      tags: [marketing]
      summary: Show unsubscribe form without changing consent
      parameters:
        - in: query
          name: token
          schema:
            type: string
      responses:
        "200":
          description: Unsubscribe form
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: unsubscribeMarketing
      tags: [marketing]
      summary: Permanently suppress marketing, including RFC 8058 one-click requests
      parameters:
        - in: query
          name: token
          description: Token from the List-Unsubscribe URL for one-click requests
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingTokenInput"
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                List-Unsubscribe:
                  type: string
                  enum: [One-Click]
      responses:
        "200":
          description: Generic idempotent unsubscribe acknowledgement
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Invalid token
        "503":
          description: Unsubscribe unavailable
  /marketing/webhook/resend:
    post:
      operationId: receiveMarketingDeliveryEvent
      tags: [marketing]
      summary: Receive signed delivery activity, bounce and complaint events
      description: Verifies Svix signature against the raw request body and rejects stale signatures. Never accepts unsigned suppression events.
      parameters:
        - in: header
          name: svix-id
          required: true
          schema:
            type: string
        - in: header
          name: svix-timestamp
          required: true
          schema:
            type: string
        - in: header
          name: svix-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingDeliveryEvent"
      responses:
        "204":
          description: Event accepted or irrelevant event ignored
        "400":
          description: Invalid event
        "401":
          description: Missing or invalid webhook signature
        "503":
          description: Event processing unavailable
  /swap/tokens:
    get:
      operationId: searchSwapTokens
      tags: [swap]
      summary: Find CEX-supported tokens; source results are Solana-only
      parameters:
        - in: query
          name: side
          required: true
          schema:
            type: string
            enum: [source, destination]
        - in: query
          name: term
          schema:
            type: string
            maxLength: 100
        - in: query
          name: chain
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Supported tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
  /swap/chains:
    get:
      operationId: getSwapChains
      tags: [swap]
      summary: List live CEX-enabled destination networks for the private route
      responses:
        "200":
          description: Available catalog networks (a quote is still required for each pair)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapChainList"
  /swap/quotes:
    get:
      operationId: getPrivateQuotes
      tags: [swap]
      summary: Get live private routes for a Solana source token
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: to
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: amount
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
        - in: query
          name: timezone
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Live private quotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteList"
  /swap/orders:
    post:
      operationId: createPrivateOrder
      tags: [swap]
      summary: Create a private swap order from a selected quote
      description: Guest orders remain supported without Authorization. When a bearer is supplied, rewards verification and active enrollment are required before claiming or contacting the provider; the order is permanently associated at creation and cannot be linked later. If verification is unavailable or enrollment is inactive, no order is created; retry without Authorization only to deliberately continue as a guest.
      parameters:
        - in: header
          name: Authorization
          required: false
          description: Optional Privy access JWT as Bearer token. If supplied, disabled/unavailable rewards fail closed with 503 and inactive enrollment fails with 409; guest creation requires omitting this header.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapOrderInput"
      responses:
        "200":
          description: Deposit instructions and new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapOrder"
        "401":
          description: Supplied Privy token is invalid or has no verified linked email
        "409":
          description: Supplied account is not currently enrolled; no order was created
        "503":
          description: Rewards verification is disabled or unavailable; no order was created
  /swap/orders/{id}:
    get:
      operationId: getPrivateOrder
      tags: [swap]
      summary: Check an existing swap order by Houdini ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Current order state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapOrder"
  /swap/near/service-status:
    get:
      operationId: getNearServiceStatus
      tags: [swap]
      summary: Cached public incident information and conservative selected-route eligibility
      parameters:
        - in: query
          name: fromChain
          schema: { type: string, minLength: 1, maxLength: 32 }
        - in: query
          name: toChain
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: Incident observation, not a guarantee of route execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearServiceStatus" }
        "400":
          description: Invalid chain query
  /swap/near/tokens:
    get:
      operationId: getNearTokens
      tags: [swap]
      summary: Supported NEAR Intents assets; Solana-only on source
      parameters:
        - in: query
          name: side
          required: true
          schema: { type: string, enum: [source, destination] }
        - in: query
          name: term
          schema: { type: string, maxLength: 70 }
      responses:
        "200":
          description: Provider-reported supported assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearTokenList" }
  /swap/near/quote:
    post:
      operationId: getNearQuote
      tags: [swap]
      summary: Preview a live confidential NEAR Intents route, without a deposit address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NearQuoteInput" }
      responses:
        "200":
          description: Dry quote bound to recipient and refund addresses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearQuote" }
  /swap/near/orders:
    post:
      operationId: createNearOrder
      tags: [swap]
      summary: Confirm the preview and generate real NEAR Intents deposit instructions
      description: Guest orders remain supported without Authorization. When a bearer is supplied, rewards verification and active enrollment are required before claiming or contacting the provider; the requestId is permanently associated at creation and cannot be linked later. If verification is unavailable or enrollment is inactive, no order is created; retry without Authorization only to deliberately continue as a guest.
      parameters:
        - in: header
          name: Authorization
          required: false
          description: Optional Privy access JWT as Bearer token. If supplied, disabled/unavailable rewards fail closed with 503 and inactive enrollment fails with 409; guest creation requires omitting this header.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NearOrderInput" }
      responses:
        "200":
          description: Deposit instructions; no funds moved by this request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearOrder" }
        "401":
          description: Supplied Privy token is invalid or has no verified linked email
        "409":
          description: Supplied account is not currently enrolled; no order was created
        "503":
          description: Rewards verification is disabled or unavailable; no order was created
  /rewards/config:
    get:
      operationId: getRewardsConfig
      tags: [rewards]
      summary: Read public email rewards availability
      responses:
        "200":
          description: Email rewards availability; Privy app ID is null when disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardsConfig" }
  /rewards/me:
    get:
      operationId: getRewardsMe
      tags: [rewards]
      summary: Read the authenticated account balance, tier, and paginated points history
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string, maxLength: 200 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Rewards balance, current versioned points/cap/tier rules, and append-only ledger page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardsMe" }
        "401":
          description: Missing or invalid Privy access token or verified email
        "503":
          description: Rewards temporarily unavailable or not configured
  /rewards/enroll:
    post:
      operationId: enrollRewards
      tags: [rewards]
      summary: Enroll the verified email account after explicit disclosure and consent
      description: No signup credit or financial redemption is offered. Award 100 points for a successful provider-verified terminal swap, capped at 300 points per UTC day. Version 1 tiers are Starter (0), Plus (500), and Pro (2000). Email is obtained only from Privy's verified linked account, stored only while enrolled, and deleted on withdrawal. Withdrawal needs a valid Privy access token but not a currently linked email. The app-scoped Privy DID, immutable order association, and append-only points ledger are retained indefinitely to preserve history and prevent duplicate awards; they never contain email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardsEnrollInput" }
      responses:
        "200":
          description: Enrollment or consent withdrawal recorded; no signup points awarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardsEnrollResponse" }
        "400":
          description: Consent is required
        "401":
          description: Missing or invalid Privy access token, or missing verified linked email when enrolling
        "503":
          description: Rewards temporarily unavailable or not configured
  /swap/near/orders/{requestId}:
    get:
      operationId: getNearOrderReceipt
      tags: [swap]
      summary: Recover a created NEAR order after a network or browser interruption
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stored signed-quote order instructions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearOrder" }
  /swap/near/status:
    get:
      operationId: getNearOrderStatus
      tags: [swap]
      summary: Check a NEAR Intents swap by its deposit address
      parameters:
        - in: query
          name: depositAddress
          required: true
          schema: { type: string, minLength: 32, maxLength: 120 }
        - in: query
          name: depositMemo
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Provider-reported order state and instructions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearOrder" }
  /explore/tokens:
    get:
      operationId: discoverTokens
      tags: [discovery]
      summary: Search Solana token market data from Tokens.xyz
      parameters:
        - in: query
          name: term
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "403":
          description: Token discovery is closed during the beta launch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaAccessError" }
        "200":
          description: Matching assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryList"
  /explore/tokens/{assetId}:
    get:
      operationId: getDiscoveredToken
      tags: [discovery]
      summary: Canonical market data and Helius on-chain metadata
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "403":
          description: Token discovery is closed during the beta launch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaAccessError" }
        "200":
          description: Asset details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryDetail"
  /swap/okx/tokens:
    get:
      operationId: searchOkxTokens
      tags: [swap]
      summary: Find OKX-supported Solana tokens
      parameters:
        - in: query
          name: term
          schema: { type: string, maxLength: 80 }
      responses:
        "403":
          description: Public swaps are closed during the beta launch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaAccessError" }
        "200":
          description: OKX Solana token list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkxTokenList"
  /swap/okx/quote:
    get:
      operationId: getOkxQuote
      tags: [swap]
      summary: Get a public same-chain Solana swap quote
      parameters:
        - in: query
          name: fromMint
          required: true
          schema: { type: string, minLength: 32, maxLength: 44 }
        - in: query
          name: toMint
          required: true
          schema: { type: string, minLength: 32, maxLength: 44 }
        - in: query
          name: amount
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "403":
          description: Public swaps are closed during the beta launch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaAccessError" }
        "200":
          description: OKX quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkxQuote"
  /swap/okx/transaction:
    post:
      operationId: buildOkxTransaction
      tags: [swap]
      summary: Build a public swap for wallet review and signing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OkxTransactionInput"
      responses:
        "403":
          description: Public swaps are closed during the beta launch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetaAccessError" }
        "200":
          description: Unsigned Solana transaction, base58 encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkxTransaction"
components:
  securitySchemes:
    launchSession:
      type: apiKey
      in: cookie
      name: darkswap_launch_session
      description: Isolated HttpOnly wallet-proof session; same-origin cookie credentials required.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LaunchMint:
      in: path
      name: mint
      required: true
      schema: { $ref: "#/components/schemas/LaunchSolanaAddress" }
    LaunchId:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    LaunchCsrf:
      in: header
      name: X-Launch-CSRF
      required: true
      description: csrfToken returned by authenticated session; validated together with allowed Origin.
      schema: { type: string, minLength: 16, maxLength: 256 }
  responses:
    LaunchBadRequest:
      description: Invalid or unsupported input, image, or query
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
    LaunchUnauthenticated:
      description: Wallet ownership session absent, expired or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
    LaunchForbidden:
      description: Invalid Origin/CSRF proof or independently unauthorized administrator
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
    LaunchNotFound:
      description: Missing/private-other-owner resource, NOT_INDEXED mint, or evidence-backed NOT_FOUND
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
    LaunchRateLimited:
      description: Local or upstream rate limit; no silently substituted fabricated data
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
    LaunchProviderFailure:
      description: Provider timeout, transport failure or invalid upstream schema
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
    LaunchUnavailable:
      description: Explicit unavailable dependency/capability; submit always returns EXECUTION_UNAVAILABLE
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LaunchApiError" }
  schemas:
    DarkRewardsEstimate:
      type: object
      required: [confirmedAsOf, pricedAt, allTimeUsd, latestAirdrop]
      properties:
        confirmedAsOf: { type: string, description: Date the distributions were confirmed by the owner }
        pricedAt: { type: string, format: date-time, description: When the token prices were fetched }
        allTimeUsd: { type: number, description: All wNEAR and DARK distributed, valued at current prices (not payout-time value) }
        latestAirdrop:
          type: object
          required: [number, usd, holders]
          properties:
            number: { type: integer, description: Sequence number of the latest $DARK airdrop }
            usd: { type: number, description: wNEAR paid in that airdrop, valued at current prices }
            holders: { type: integer, description: Eligible holders paid in that airdrop }
    LaunchSolanaAddress:
      type: string
      minLength: 32
      maxLength: 44
      pattern: "^[1-9A-HJ-NP-Za-km-z]{32,44}$"
      description: Base58 Solana address; server must additionally validate decoded 32-byte public key.
    LaunchApiError:
      type: object
      additionalProperties: false
      required: [error, code, executionAvailable]
      properties:
        error: { type: string, minLength: 1 }
        code:
          type: string
          enum: [INVALID_INPUT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, NOT_INDEXED, RATE_LIMITED, PROVIDER_FAILURE, STORAGE_UNAVAILABLE, SERVICE_UNAVAILABLE, EXECUTION_UNAVAILABLE]
        executionAvailable: { type: boolean, enum: [false] }
    StonkfunSource:
      type: object
      additionalProperties: false
      required: [provider, fetchedAt, generatedAt, stale, cacheAgeSeconds]
      properties:
        provider: { type: string, enum: [stonkfun] }
        fetchedAt: { type: string, format: date-time }
        generatedAt: { type: ["string", "null"], format: date-time }
        stale: { type: boolean }
        cacheAgeSeconds: { type: number, minimum: 0 }
    StonkfunCoverage:
      type: object
      additionalProperties: false
      required: [scope, searchScope, viewFilterScope, creatorSearchAvailable, holderMetricsAvailable, transactionMetricsAvailable, graduationStatusVerified, rankingSignals, warnings]
      properties:
        scope: { type: string, enum: [provider_page, indexed_catalog] }
        searchScope: { type: string, enum: [provider_catalog, none] }
        viewFilterScope: { type: string, enum: [provider_catalog, current_page, none], description: Distinguishes server-side provider filters from local multiple-mint NEAR filtering }
        creatorSearchAvailable: { type: boolean, enum: [false] }
        holderMetricsAvailable: { type: boolean, enum: [false] }
        transactionMetricsAvailable: { type: boolean, enum: [false] }
        graduationStatusVerified:
          type: boolean
          description: Documented new/aboutToGraduate/graduated categories are verified; precise progress algorithm is not. Never compute classification from current market cap.
        rankingSignals:
          type: array
          items: { type: string, enum: [provider_volume, provider_newest] }
        warnings:
          type: array
          items: { type: string }
    StonkfunPagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, total, totalPages, returned, maxAccessiblePage]
      properties:
        page: { type: integer, minimum: 1, maximum: 100 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: Provider total AFTER upstream filters but BEFORE any additional local view filtering }
        totalPages: { type: integer, minimum: 0, description: Provider page count AFTER upstream filters but BEFORE any additional local view filtering }
        returned: { type: integer, minimum: 0, description: Count AFTER any additional local view filtering }
        maxAccessiblePage: { type: integer, minimum: 1, maximum: 100, description: Minimum of upstream totalPages and local safety cap 100 (at least 1) }
    StonkfunTokenLinks:
      type: object
      additionalProperties: false
      required: [website, x, telegram, discord, github]
      properties:
        website: { type: ["string", "null"], format: uri }
        x: { type: ["string", "null"], format: uri }
        telegram: { type: ["string", "null"], format: uri }
        discord: { type: ["string", "null"], format: uri }
        github: { type: ["string", "null"], format: uri }
      description: Only validated HTTP(S) links; unsafe or absent provider metadata becomes null.
    StonkfunTokenQuote:
      type: ["object", "null"]
      additionalProperties: false
      required: [mint, symbol, name, logoUrl, category, categoryLabel, group, verified]
      properties:
        mint: { $ref: "#/components/schemas/LaunchSolanaAddress" }
        symbol: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        logoUrl: { type: ["string", "null"], format: uri }
        category: { type: ["string", "null"] }
        categoryLabel: { type: ["string", "null"] }
        group: { type: string, enum: [dark, near, stablecoin, other] }
        verified: { type: boolean, description: Quote mint is matched against the current validated pair catalog; not an authenticity endorsement }
    StonkfunTokenMetrics:
      type: object
      additionalProperties: false
      required: [priceUsd, marketCapUsd, fdvUsd, volume24hUsd, liquidityUsd, peakMarketCapUsd, priceChange24h, holders, transactions, uniqueBuyers, holderGrowth]
      properties:
        priceUsd: { type: ["number", "null"], minimum: 0 }
        marketCapUsd: { type: ["number", "null"], minimum: 0 }
        fdvUsd: { type: ["number", "null"], minimum: 0 }
        volume24hUsd: { type: ["number", "null"], minimum: 0 }
        liquidityUsd: { type: ["number", "null"], minimum: 0 }
        peakMarketCapUsd: { type: ["number", "null"], minimum: 0 }
        priceChange24h: { type: ["number", "null"], description: Raw provider value when present; units are not locally inferred }
        holders: { type: ["integer", "null"], minimum: 0 }
        transactions: { type: ["integer", "null"], minimum: 0 }
        uniqueBuyers: { type: ["integer", "null"], minimum: 0 }
        holderGrowth: { type: ["number", "null"] }
      description: Null means unavailable, not zero. Current public discovery lacks holder/transaction/buyer/growth evidence.
    StonkfunToken:
      type: object
      additionalProperties: false
      required: [mint, network, pool, name, symbol, description, imageUrl, links, quote, launchpad, mode, quoteOnlyFees, transferFeeBps, metrics, status, graduationProgress, createdAt, graduatedAt, creatorWallet, darkPair, underReview, metadataSuppressed]
      properties:
        mint: { $ref: "#/components/schemas/LaunchSolanaAddress" }
        network: { type: string, enum: [mainnet-beta] }
        pool: { type: ["string", "null"] }
        name: { type: string, maxLength: 200 }
        symbol: { type: string, maxLength: 64 }
        description: { type: ["string", "null"], maxLength: 2000 }
        imageUrl: { type: ["string", "null"], format: uri }
        links: { $ref: "#/components/schemas/StonkfunTokenLinks" }
        quote: { $ref: "#/components/schemas/StonkfunTokenQuote" }
        launchpad: { type: ["string", "null"] }
        mode: { type: ["string", "null"] }
        quoteOnlyFees: { type: ["boolean", "null"] }
        transferFeeBps:
          type: ["integer", "null"]
          minimum: 0
          maximum: 10000
          description: Provider token transfer fee metadata, NOT a verified token launch fee.
        metrics: { $ref: "#/components/schemas/StonkfunTokenMetrics" }
        status: { type: ["string", "null"], description: Raw upstream status; documented categories new/aboutToGraduate/graduated. Unknown future values are preserved, not reclassified }
        graduationProgress: { type: ["number", "null"], description: Raw upstream value; units/thresholds not independently documented }
        createdAt: { type: ["string", "null"], format: date-time }
        graduatedAt: { type: ["string", "null"], format: date-time, description: Provider timestamp; may precede createdAt. Neither is asserted to be immutable chain launch time }
