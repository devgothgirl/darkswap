<!DOCTYPE html>
<!-- Dark is the design system's default, not an opt-in: the class stays on. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060b" />
    <script>
      /* Pool pages (testnet) run without the site analytics tracker. */
      (function () { try {
        var p = location.pathname.slice('%BASE_URL%'.length - 1), k = 'darkswap.poolAnalyticsOff';
        if (p === '/pool' || p.indexOf('/pool/') === 0) { localStorage.setItem('umami.disabled', '1'); localStorage.setItem(k, '1'); }
        else if (localStorage.getItem(k)) { localStorage.removeItem('umami.disabled'); localStorage.removeItem(k); }
      } catch (e) {} })();
    </script>
    <!--SEO_HEAD-->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png?v=3" />
    <link rel="shortcut icon" type="image/x-icon" href="%BASE_URL%favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=3" />
  </head>
  <body>
    <div id="root"><!--SEO_CONTENT--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
