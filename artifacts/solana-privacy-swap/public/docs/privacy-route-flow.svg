<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">DarkSwap privacy route: wallet to Privacy Routers to receiving wallet</title>
  <desc id="description">First review a live quote and create an order. You manually send a Solana deposit from your wallet. Privacy Routers execute the selected route and, if successful, deliver the quoted asset to the receiving wallet. Track the order separately. Solana deposits are public and privacy is not guaranteed.</desc>
  <rect width="1440" height="760" rx="28" fill="#151020"/>
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="64" y="53" width="9" height="23" rx="3" fill="#bd8bfa"/>
    <text x="89" y="74" fill="#d0b1fb" font-size="21" font-weight="700" letter-spacing="2">DARKSWAP / ROUTE GUIDE</text>
    <text x="64" y="135" fill="#faf5ff" font-size="43" font-weight="700">Review. Deposit. Track.</text>
    <rect x="64" y="170" width="1312" height="64" rx="12" fill="#241933" stroke="#5f457a"/>
    <text x="88" y="211" fill="#e4d7f3" font-size="23">Before you send: review a live quote, confirm the destination and create an order.</text>

    <rect x="64" y="304" width="280" height="208" rx="22" fill="#21182e" stroke="#795996" stroke-width="2"/>
    <text x="90" y="342" fill="#c5a0ec" font-size="18" font-weight="700">01 / YOU SEND</text>
    <g fill="none" stroke="#d0a5ff" stroke-width="3" stroke-linejoin="round">
      <rect x="90" y="363" width="45" height="33" rx="5"/>
      <path d="M90 370v-11h36v4M120 375h18v15h-18z"/>
      <path d="M125 382h4"/>
    </g>
    <text x="90" y="435" fill="#faf5ff" font-size="30" font-weight="700">Your wallet</text>
    <text x="90" y="470" fill="#dbcee9" font-size="20">Send from Solana</text>

    <path d="M356 412H526M515 401l12 11-12 11" fill="none" stroke="#c59bf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g text-anchor="middle" fill="#dfcbee" font-size="20">
      <text x="442" y="355">Manual</text>
      <text x="442" y="383">deposit</text>
    </g>

    <rect x="540" y="304" width="360" height="208" rx="22" fill="#38234f" stroke="#ba85f0" stroke-width="2"/>
    <text x="568" y="342" fill="#dec1ff" font-size="18" font-weight="700">02 / ROUTE EXECUTION</text>
    <g fill="none" stroke="#dec1ff" stroke-width="3">
      <path d="M579 380h32m-16 0 16-13m-16 13 16 13"/>
      <circle cx="574" cy="380" r="5"/><circle cx="616" cy="366" r="5"/><circle cx="616" cy="394" r="5"/>
    </g>
    <text x="568" y="435" fill="#faf5ff" font-size="31" font-weight="700">Privacy Routers</text>
    <text x="568" y="470" fill="#eadbf7" font-size="20">Execute the selected route</text>

    <path d="M912 412H1082M1071 401l12 11-12 11" fill="none" stroke="#c59bf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g text-anchor="middle" fill="#dfcbee" font-size="20">
      <text x="998" y="355">Successful</text>
      <text x="998" y="383">settlement</text>
    </g>

    <rect x="1096" y="304" width="280" height="208" rx="22" fill="#21182e" stroke="#795996" stroke-width="2"/>
    <text x="1122" y="342" fill="#c5a0ec" font-size="18" font-weight="700">03 / YOU RECEIVE</text>
    <g fill="none" stroke="#d0a5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1122 380v17h43v-17m-21-21v28m-9-9 9 9 9-9"/>
    </g>
    <text x="1122" y="435" fill="#faf5ff" font-size="27" font-weight="700">Receiving wallet</text>
    <text x="1122" y="470" fill="#dbcee9" font-size="18">Quoted asset + network</text>

    <rect x="64" y="556" width="1312" height="65" rx="12" fill="#21182e" stroke="#4d395f"/>
    <circle cx="97" cy="589" r="10" fill="none" stroke="#bf9cde" stroke-width="2"/>
    <path d="M97 582v8l5 3" fill="none" stroke="#bf9cde" stroke-width="2" stroke-linecap="round"/>
    <text x="125" y="597" fill="#e4d7f3" font-size="22">Track your order until completion. Timing and availability depend on the selected route.</text>
    <path d="M64 658H1376" stroke="#4d395f"/>
    <text x="64" y="696" fill="#c9b9d8" font-size="20">Creating an order does not move funds. You send the deposit yourself.</text>
    <text x="64" y="728" fill="#c9b9d8" font-size="20">Solana deposits are public. A private route does not guarantee anonymity or unlinkability.</text>
  </g>
</svg>